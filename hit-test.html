<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='css/common.css'>
    <style>
      /* Temporary styles to ensure button visibility */
      .xr-button {
        display: block !important;
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        margin-top: 10px;
      }
    </style>
    <title>Hit Test with PNG</title>
  </head>
  <body>
    <header>
      <details open>
        <summary>Hit Test with PNG</summary>
        <p>
          This sample demonstrates the use of hit testing to place a PNG image on real-world surfaces.
          <a class="back" href="./">Back</a>
        </p>
      </details>
    </header>
    <script type="module">
      import {WebXRButton} from './js/util/webxr-button.js';
      import {Scene} from './js/render/scenes/scene.js';
      import {Renderer, createWebGLContext} from './js/render/core/renderer.js';
      import {Node} from './js/render/core/node.js';
      import {Gltf2Node} from './js/render/nodes/gltf2.js';
      import {DropShadowNode} from './js/render/nodes/drop-shadow.js';
      import {vec3, mat4} from './js/render/math/gl-matrix.js';
      import {Ray} from './js/render/math/ray.js';

      // Custom function to create a textured plane for the PNG
      function createTexturedPlane(url) {
        const geometry = {
          vertices: new Float32Array([
            -0.5, -0.5, 0, // Bottom-left
             0.5, -0.5, 0, // Bottom-right
             0.5,  0.5, 0, // Top-right
            -0.5,  0.5, 0  // Top-left
          ]),
          indices: new Uint16Array([0, 1, 2, 0, 2, 3]),
          texcoords: new Float32Array([
            0, 0, // Bottom-left
            1, 0, // Bottom-right
            1, 1, // Top-right
            0, 1  // Top-left
          ])
        };

        const texture = new Image();
        texture.src = url;
        texture.crossOrigin = 'anonymous';

        const node = new Node();
        node.geometry = geometry;
        node.texture = texture;
        node.onload = () => {
          texture.onload = () => {
            node.texture = texture;
          };
        };

        return node;
      }

      // XR globals.
      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      // WebGL scene globals.
      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);

      // Replace sunflower GLTF with PNG textured plane
      let imagePlane = createTexturedPlane('media/images/wallart.png'); // Replace with your PNG path
      arObject.addNode(imagePlane);

      let reticle = new Gltf2Node({url: 'media/gltf/reticle/reticle.gltf'});
      reticle.visible = false;
      scene.addNode(reticle);

      // Drop shadow for grounding the object
      let shadow = new DropShadowNode();
      vec3.set(shadow.scale, 0.15, 0.15, 0.15);
      arObject.addNode(shadow);

      const MAX_OBJECTS = 30;
      let objects = [];

      // Ensure the background is transparent for AR.
      scene.clear = false;

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession: onRequestSession,
          onEndSession: onEndSession,
          textEnterXRTitle: "START AR",
          textXRNotFoundTitle: "AR NOT FOUND",
          textExitXRTitle: "EXIT AR",
        });
        console.log('xrButton.domElement:', xrButton.domElement); // Debug
        if (!xrButton.domElement) {
          console.warn('WebXRButton.domElement is null, creating fallback button');
          xrButton.domElement = document.createElement('button');
          xrButton.domElement.textContent = "START AR";
          xrButton.domElement.className = 'xr-button';
          xrButton.domElement.onclick = onRequestSession;
        }
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar')
                      .then((supported) => {
            console.log('AR supported:', supported); // Debug
            xrButton.enabled = supported;
            if (!supported) {
              xrButton.domElement.textContent = "AR NOT SUPPORTED";
              xrButton.domElement.disabled = true;
            }
          }).catch((error) => {
            console.error('isSessionSupported error:', error);
            xrButton.domElement.textContent = "AR ERROR";
            xrButton.domElement.disabled = true;
          });
        } else {
          console.warn('navigator.xr not available');
          xrButton.domElement.textContent = "WEBXR NOT AVAILABLE";
          xrButton.domElement.disabled = true;
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {requiredFeatures: ['local', 'hit-test']})
                           .then((session) => {
          xrButton.setSession(session);
          onSessionStarted(session);
        }).catch((error) => {
          console.error('requestSession error:', error);
          xrButton.domElement.textContent = "AR SESSION FAILED";
        });
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (!gl) {
          gl = createWebGLContext({
            xrCompatible: true,
            alpha: true
          });

          renderer = new Renderer(gl);

          renderer.addShader({
            vertexShader: `
              attribute vec3 a_position;
              attribute vec2 a_texcoord;
              uniform mat4 u_matrix;
              varying vec2 v_texcoord;
              void main() {
                gl_Position = u_matrix * vec4(a_position, 1.0);
                v_texcoord = a_texcoord;
              }
            `,
            fragmentShader: `
              precision mediump float;
              varying vec2 v_texcoord;
              uniform sampler2D u_texture;
              void main() {
                gl_FragColor = texture2D(u_texture, v_texcoord);
              }
            `
          });

          scene.setRenderer(renderer);
        }

        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrViewerSpace = refSpace;
          session.requestHitTestSource({ space: xrViewerSpace }).then((hitTestSource) => {
            xrHitTestSource = hitTestSource;
          });
        });

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onEndSession(session) {
        xrHitTestSource.cancel();
        xrHitTestSource = null;
        session.end();
      }

      function onSessionEnded(event) {
        xrButton.setSession(null);
      }

      function addARObjectAt(matrix) {
        let newObject = arObject.clone();
        newObject.visible = true;
        newObject.matrix = matrix;
        scene.addNode(newObject);

        objects.push(newObject);

        if (objects.length > MAX_OBJECTS) {
          let oldObject = objects.shift();
          scene.removeNode(oldObject);
        }
      }

      let rayOrigin = vec3.create();
      let rayDirection = vec3.create(); // Fixed typo: 'does' to 'let'

      function onSelect(event) {
        if (reticle.visible) {
          addARObjectAt(reticle.matrix);
        }
      }

      function onXRFrame(t, frame) {
        let session = frame.session;
        let pose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;

        if (xrHitTestSource && pose) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(xrRefSpace);
            reticle.visible = true;
            reticle.matrix = pose.transform.matrix;

            let viewerPos = vec3.fromValues(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
            let targetPos = vec3.fromValues(pose.transform.matrix[12], pose.transform.matrix[13], pose.transform.matrix[14]);
            let direction = vec3.create();
            vec3.subtract(direction, viewerPos, targetPos);
            vec3.normalize(direction, direction);
            let up = vec3.fromValues(0, 1, 0);
            let right = vec3.create();
            vec3.cross(right, direction, up);
            vec3.normalize(right, right);
            let newUp = vec3.create();
            vec3.cross(newUp, right, direction);
            let matrix = mat4.create();
            mat4.fromRotationTranslation(matrix, mat4.fromValues(
              right[0], right[1], right[2], 0,
              newUp[0], newUp[1], newUp[2], 0,
              -direction[0], -direction[1], -direction[2], 0,
              0, 0, 0, 1
            ), targetPos);
            imagePlane.matrix = matrix;
          }
        }

        scene.startFrame();
        session.requestAnimationFrame(onXRFrame);
        scene.drawXRFrame(frame, pose);
        scene.endFrame();
      }

      // Start the XR application with error handling
      try {
        initXR();
      } catch (error) {
        console.error('initXR failed:', error);
      }
    </script>
  </body>
</html>
