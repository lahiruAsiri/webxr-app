<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='css/common.css'>

    <title>AR Poster Demo</title>
  </head>
  <body>
    <header>
      <details open>
        <summary>AR Poster Demo</summary>
        <p>
          This sample demonstrates placing PNG posters on real-world surfaces using hit testing.
          <a class="back" href="./">Back</a>
        </p>
      </details>
    </header>
    <script type="module">
      import {WebXRButton} from './js/util/webxr-button.js';
      import {Scene} from './js/render/scenes/scene.js';
      import {Renderer, createWebGLContext} from './js/render/core/renderer.js';
      import {Node} from './js/render/core/node.js';
      import {Gltf2Node} from './js/render/nodes/gltf2.js';
      import {DropShadowNode} from './js/render/nodes/drop-shadow.js';
      import {vec3} from './js/render/math/gl-matrix.js';

      // XR globals.
      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      // WebGL scene globals.
      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      // Create a base node for our AR content
      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);

      // Create a textured quad for our poster
      function createPosterNode(imageUrl) {
        const posterNode = new Node();
        
        // Create plane geometry (1 unit wide and tall)
        const vertices = new Float32Array([
          -0.5, -0.5, 0,  // bottom left
           0.5, -0.5, 0,  // bottom right
           0.5,  0.5, 0,  // top right
          -0.5,  0.5, 0   // top left
        ]);
        
        const indices = new Uint16Array([0, 1, 2, 0, 2, 3]);
        
        const texCoords = new Float32Array([
          0, 1,  // bottom left
          1, 1,  // bottom right
          1, 0,  // top right
          0, 0   // top left
        ]);
        
        // Create material
        const material = {
          baseColorTexture: { uri: imageUrl },
          baseColorFactor: [1, 1, 1, 1],
          doubleSided: true
        };
        
        // Add render primitive to the node
        posterNode.addRenderPrimitive({
          vertices: vertices,
          indices: indices,
          texCoords: texCoords,
          material: material
        });
        
        // Scale to appropriate size (1 meter wide, height based on image aspect ratio)
        return posterNode;
      }

      // Create a sample poster (replace with your image path)
      let poster = createPosterNode('media/images/wallart.png');
      arObject.addNode(poster);

      // Reticle for placement
      let reticle = new Gltf2Node({url: 'media/gltf/reticle/reticle.gltf'});
      reticle.visible = false;
      scene.addNode(reticle);

      // Drop shadow
      let shadow = new DropShadowNode();
      vec3.set(shadow.scale, 0.5, 0.5, 0.5); // Adjusted for poster size
      arObject.addNode(shadow);

      const MAX_POSTERS = 30;
      let posters = [];

      // Ensure the background is transparent for AR
      scene.clear = false;

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession: onRequestSession,
          onEndSession: onEndSession,
          textEnterXRTitle: "START AR",
          textXRNotFoundTitle: "AR NOT FOUND",
          textExitXRTitle: "EXIT AR",
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar')
                      .then((supported) => {
            xrButton.enabled = supported;
          });
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {requiredFeatures: ['local', 'hit-test']})
                           .then((session) => {
          xrButton.setSession(session);
          onSessionStarted(session);
        });
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (!gl) {
          gl = createWebGLContext({
            xrCompatible: true
          });

          renderer = new Renderer(gl);
          scene.setRenderer(renderer);
        }

        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

        // Set up hit testing
        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrViewerSpace = refSpace;
          session.requestHitTestSource({ space: xrViewerSpace }).then((hitTestSource) => {
            xrHitTestSource = hitTestSource;
          });
        });

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onEndSession(session) {
        if (xrHitTestSource) {
          xrHitTestSource.cancel();
          xrHitTestSource = null;
        }
        session.end();
      }

      function onSessionEnded(event) {
        xrButton.setSession(null);
      }

      function addARObjectAt(matrix) {
        let newPoster = arObject.clone();
        newPoster.visible = true;
        newPoster.matrix = matrix;
        scene.addNode(newPoster);

        posters.push(newPoster);

        // Limit the number of posters for performance
        if (posters.length > MAX_POSTERS) {
          let oldPoster = posters.shift();
          scene.removeNode(oldPoster);
        }
      }

      function onSelect(event) {
        if (reticle.visible) {
          addARObjectAt(reticle.matrix);
        }
      }

      function onXRFrame(t, frame) {
        let session = frame.session;
        let pose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;

        // Update hit test results
        if (xrHitTestSource && pose) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(xrRefSpace);
            reticle.visible = true;
            reticle.matrix = pose.transform.matrix;
          }
        }

        scene.startFrame();
        session.requestAnimationFrame(onXRFrame);
        scene.drawXRFrame(frame, pose);
        scene.endFrame();
      }

      // Start the XR application
      initXR();
    </script>
  </body>
</html>
