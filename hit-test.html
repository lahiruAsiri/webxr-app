<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; }
      #guidance {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 1000;
        font-family: Arial, sans-serif;
        display: none;
      }
      #debug-console {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        overflow-y: auto;
        pointer-events: none;
        z-index: 1001;
      }
      #debug-console pre {
        margin: 0;
        padding: 5px;
        white-space: pre-wrap;
      }
    </style>
    <title>AR Hit Test with Debug</title>
  </head>
  <body>
    <header>
      <details open>
        <summary>AR Hit Test</summary>
        <p>
          Point at a surface to see the reticle, then tap to place a poster. Debug messages appear at the bottom of the screen.
          <a class="back" href="./">Back</a>
        </p>
      </details>
    </header>
    <div id="guidance">Point at a surface to see the reticle and tap to place the poster.</div>
    <div id="debug-console"><pre></pre></div>
    <script type="module">
      import {WebXRButton} from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/webxr/WebXRButton.js';
      import {Scene} from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/render/scenes/Scene.js';
      import {Renderer, createWebGLContext} from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/render/core/renderer.js';
      import {Node} from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/render/core/node.js';
      import {Gltf2Node} from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/render/nodes/gltf2.js';
      import {vec3, mat4} from 'https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/dist/gl-matrix.js';

      const debugPre = document.querySelector('#debug-console pre');
      function log(message) {
        const lines = debugPre.innerText.split('\n');
        lines.push(message);
        if (lines.length > 20) {
          lines.shift();
        }
        debugPre.innerText = lines.join('\n');
        debugPre.scrollTop = debugPre.scrollHeight;
      }

      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);

      let wallArt = new Gltf2Node({url: 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/models/gltf/DamagedHelmet.gltf'});
      vec3.set(wallArt.scale, 0.5, 0.5, 0.5);
      wallArt.onLoad = () => log('Model loaded successfully');
      wallArt.onError = (error) => log('Error loading model: ' + error);
      arObject.addNode(wallArt);

      let reticle = new Gltf2Node({url: 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/models/gltf/reticle.gltf'});
      reticle.visible = false;
      scene.addNode(reticle);

      scene.clear = false;

      let currentPoster = null;

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession: onRequestSession,
          onEndSession: onEndSession,
          textEnterXRTitle: "START AR",
          textXRNotFoundTitle: "AR NOT FOUND",
          textExitXRTitle: "EXIT AR",
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar')
            .then((supported) => {
              xrButton.enabled = supported;
              log('AR supported: ' + supported);
            })
            .catch((error) => log('AR support check failed: ' + error));
        } else {
          log('navigator.xr not available');
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local', 'dom-overlay'],
          optionalFeatures: ['hit-test'],
          domOverlay: { root: document.body }
        }).then((session) => {
          xrButton.setSession(session);
          onSessionStarted(session);
        }).catch((error) => {
          log('Session request failed: ' + error);
        });
      }

      function onSessionStarted(session) {
        log('AR session started');
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (!gl) {
          gl = createWebGLContext({ xrCompatible: true, alpha: true });
          if (!gl) {
            log('Failed to create WebGL context');
            session.end();
            return;
          }
          renderer = new Renderer(gl);
          scene.setRenderer(renderer);
        }

        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) })
          .catch((error) => {
            log('Render state update failed: ' + error);
            session.end();
          });

        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrViewerSpace = refSpace;
          session.requestHitTestSource({ space: xrViewerSpace }).then((hitTestSource) => {
            xrHitTestSource = hitTestSource;
            log('Hit test source initialized');
          }).catch((error) => log('Hit test source failed: ' + error));
        });

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        }).catch((error) => log('Reference space failed: ' + error));

        document.getElementById('guidance').style.display = 'block';
      }

      function onEndSession(session) {
        if (xrHitTestSource) {
          xrHitTestSource.cancel();
          xrHitTestSource = null;
        }
        session.end();
      }

      function onSessionEnded(event) {
        xrButton.setSession(null);
        log('AR session ended');
      }

      function addARObjectAt(matrix) {
        if (currentPoster) return;
        log('Adding object to scene');
        let hitMatrix = mat4.clone(matrix);
        let position = vec3.create();
        mat4.getTranslation(position, hitMatrix);
        log('Object position: ' + position.join(', '));
        let newObject = arObject.clone();
        newObject.visible = true;
        newObject.matrix = hitMatrix;
        currentPoster = newObject;
        scene.addNode(newObject);
        document.getElementById('guidance').style.display = 'none';
      }

      function onSelect(event) {
        log('Screen tapped');
        if (reticle.visible) {
          addARObjectAt(reticle.matrix);
        } else {
          log('Reticle not visible, cannot place object');
        }
      }

      function onXRFrame(t, frame) {
        let session = frame.session;
        let pose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;
        document.getElementById('guidance').style.display = currentPoster ? 'none' : 'block';

        if (xrHitTestSource && pose && !currentPoster) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) {
            log('Hit test detected surface');
            let hitPose = hitTestResults[0].getPose(xrRefSpace);
            reticle.visible = true;
            reticle.matrix = hitPose.transform.matrix;
            document.getElementById('guidance').style.display = 'none';
          } else {
            log('No surface detected');
          }
        }

        scene.startFrame();
        session.requestAnimationFrame(onXRFrame);
        scene.drawXRFrame(frame, pose);
        scene.endFrame();
      }

      initXR();
    </script>
  </body>
</html>
