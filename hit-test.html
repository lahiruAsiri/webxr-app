<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #guidance {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 10px 20px;
        border-radius: 10px;
        z-index: 1000;
        font-family: Arial, sans-serif;
      }
      #debug {
        position: fixed;
        bottom: 0;
        left: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px;
        z-index: 1000;
        font-family: monospace;
        font-size: 12px;
        max-width: 100%;
        overflow: auto;
        max-height: 150px;
      }
      #start-ar {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 1000;
        padding: 8px 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
    <title>AR Wall Art (Three.js)</title>
  </head>
  <body>
    <div id="guidance">Point at a wall to place your artwork.</div>
    <div id="debug"></div>
    <button id="start-ar">Start AR</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r168/three.min.js"></script>
    <script>
      function logDebug(message) {
        console.log('[DEBUG]', message);
        const debugDiv = document.getElementById('debug');
        debugDiv.textContent += message + '\n';
        debugDiv.scrollTop = debugDiv.scrollHeight;
      }

      // Three.js setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Reticle
      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.05, 0.06, 32),
        new THREE.MeshBasicMaterial({ color: 0x0000ff, side: THREE.DoubleSide })
      );
      reticle.visible = false;
      scene.add(reticle);

      let poster = null;
      let xrSession = null;
      let hitTestSource = null;
      let referenceSpace = null;

      async function startXR() {
        if (!navigator.xr) {
          logDebug('WebXR not supported on this device/browser');
          alert('WebXR not supported. Use Chrome on an AR-capable Android device.');
          return;
        }

        try {
          // Check AR support
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (!supported) {
            logDebug('Immersive AR not supported');
            alert('Immersive AR not supported on this device.');
            return;
          }

          // Start AR session
          xrSession = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['local'],
            optionalFeatures: ['hit-test', 'dom-overlay'],
            domOverlay: { root: document.body },
          });
          logDebug('XR session started');

          // Bind session to renderer
          renderer.xr.setSession(xrSession);
          xrSession.addEventListener('end', onSessionEnd);

          // Get reference spaces
          referenceSpace = await xrSession.requestReferenceSpace('local').catch((err) => {
            logDebug(`Local reference space error: ${err.message}`);
            throw err;
          });

          // Attempt hit-test
          try {
            const viewerSpace = await xrSession.requestReferenceSpace('viewer');
            hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
            logDebug('Hit test source created');
          } catch (err) {
            logDebug(`Hit test not supported: ${err.message}`);
            hitTestSource = null;
          }

          document.getElementById('guidance').style.display = 'block';
          animate();
        } catch (error) {
          logDebug(`XR session error: ${error.message}`);
          alert(`Failed to start AR: ${error.message}`);
          xrSession = null;
          renderer.setAnimationLoop(null); // Stop loop on failure
        }
      }

      function onSessionEnd() {
        logDebug('XR session ended');
        xrSession = null;
        hitTestSource = null;
        reticle.visible = false;
        poster = null;
        document.getElementById('guidance').style.display = 'block';
        renderer.setAnimationLoop(null); // Stop animation loop
      }

      function animate() {
        renderer.setAnimationLoop((time, frame) => {
          if (!xrSession) {
            logDebug('XR session inactive; stopping animation loop');
            renderer.setAnimationLoop(null); // Stop loop
            return;
          }

          if (!frame) {
            logDebug('No XR frame available');
            return;
          }

          const pose = frame.getViewerPose(referenceSpace);
          if (!pose) {
            logDebug('No viewer pose available');
            reticle.visible = false;
            return;
          }

          reticle.visible = false;
          document.getElementById('guidance').style.display = 'block';

          if (hitTestSource && !poster) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            logDebug(`Hit test results: ${hitTestResults.length}`);
            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0].getPose(referenceSpace);
              reticle.matrix.fromArray(hit.transform.matrix);
              reticle.matrix.decompose(reticle.position, reticle.quaternion, reticle.scale);
              reticle.visible = true;
              document.getElementById('guidance').style.display = 'none';
              logDebug(`Reticle position: [${reticle.position.x.toFixed(3)}, ${reticle.position.y.toFixed(3)}, ${reticle.position.z.toFixed(3)}]`);
            }
          }

          renderer.render(scene, camera);
        });
      }

      function placePoster() {
        if (reticle.visible && !poster) {
          const geometry = new THREE.PlaneGeometry(0.5, 0.5);
          const texture = new THREE.TextureLoader().load(
            'media/images/wallart.png',
            () => {
              logDebug('Image loaded successfully');
              texture.needsUpdate = true;
            },
            undefined,
            (err) => {
              logDebug(`Image load error: ${err.message || 'Failed to load image'}`);
            }
          );
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
          });
          poster = new THREE.Mesh(geometry, material);
          poster.position.copy(reticle.position);
          poster.quaternion.copy(reticle.quaternion);
          scene.add(poster);
          document.getElementById('guidance').style.display = 'none';
          logDebug(`Poster placed at [${poster.position.x.toFixed(3)}, ${poster.position.y.toFixed(3)}, ${poster.position.z.toFixed(3)}]`);
        }
      }

      // Event listeners
      document.getElementById('start-ar').addEventListener('click', startXR);
      renderer.domElement.addEventListener('click', placePoster);

      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
