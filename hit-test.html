<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      body { margin: 0; overflow: hidden; }
      #guidance {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 10px 20px;
        border-radius: 10px;
        z-index: 1000;
        font-family: Arial, sans-serif;
      }
      #debug {
        position: fixed;
        bottom: 0;
        left: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px;
        z-index: 1000;
        font-family: monospace;
        font-size: 12px;
        max-width: 100%;
        overflow: auto;
        max-height: 150px;
      }
    </style>
    <title>AR Wall Art (Three.js)</title>
  </head>
  <body>
    <div id="guidance">Point at a wall to place your artwork.</div>
    <div id="debug"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
      function logDebug(message) {
        console.log('[DEBUG]', message);
        const debugDiv = document.getElementById('debug');
        debugDiv.textContent += message + '\n';
        debugDiv.scrollTop = debugDiv.scrollHeight;
      }

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      let reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.05, 0.06, 32),
        new THREE.MeshBasicMaterial({ color: 0x0000ff })
      );
      reticle.visible = false;
      scene.add(reticle);

      let poster = null;
      let xrSession = null;
      let hitTestSource = null;
      let referenceSpace = null;

      async function startXR() {
        try {
          xrSession = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['local', 'hit-test'],
            domOverlay: { root: document.body },
          });
          renderer.xr.setSession(xrSession);
          referenceSpace = await xrSession.requestReferenceSpace('local');
          hitTestSource = await xrSession.requestHitTestSource({ space: await xrSession.requestReferenceSpace('viewer') });
          document.getElementById('guidance').style.display = 'block';
          logDebug('XR session started');
          animate();
        } catch (error) {
          logDebug(`XR Error: ${error.message}`);
        }
      }

      function animate() {
        renderer.setAnimationLoop((time, frame) => {
          if (!frame) return;

          const pose = frame.getViewerPose(referenceSpace);
          reticle.visible = false;

          if (hitTestSource && pose && !poster) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length) {
              const hit = hitTestResults[0].getPose(referenceSpace);
              reticle.matrix.fromArray(hit.transform.matrix);
              reticle.matrix.decompose(reticle.position, reticle.quaternion, reticle.scale);
              reticle.visible = true;
              document.getElementById('guidance').style.display = 'none';
            }
          }

          renderer.render(scene, camera);
        });
      }

      function placePoster() {
        if (reticle.visible && !poster) {
          const geometry = new THREE.PlaneGeometry(0.5, 0.5);
          const texture = new THREE.TextureLoader().load('media/images/wallart.png', () => {
            logDebug('Image loaded successfully');
          });
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
          });
          poster = new THREE.Mesh(geometry, material);
          poster.position.copy(reticle.position);
          poster.quaternion.copy(reticle.quaternion);
          scene.add(poster);
          document.getElementById('guidance').style.display = 'none';
          logDebug('Poster placed');
        }
      }

      renderer.domElement.addEventListener('click', placePoster);

      document.body.innerHTML += '<button style="position: fixed; top: 10px; left: 10px; z-index: 1000;">Start AR</button>';
      document.querySelector('button').addEventListener('click', startXR);
    </script>
  </body>
</html>
